<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080A12">
<meta name="description" content="LifeGame — Play. Create. Connect.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="LifeGame">
<meta property="og:description" content="Une plateforme de jeux moderne et originale.">
<link rel="stylesheet" href="./styles.css?v=f9b516a">
<link rel="manifest" href="./manifest.webmanifest?v=f9b516a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237C5CFF'/%3E%3Cpath d='M19 16v32h10V37h8c10 0 15-5 15-11S47 16 37 16H19zm10 8h8c4 0 6 1 6 4s-2 4-6 4h-8v-8z' fill='white'/%3E%3C/svg%3E">
<title>LifeGame</title>
</head>
<body>
<div id="app"><div class="boot-screen"><div class="boot-logo">L</div><strong>LifeGame</strong><span>Préparation de la plateforme…</span></div></div>

<script>
(async () => {
  try {
    // Anciennes versions de LifeGame ont utilisé un Service Worker agressif.
    // On nettoie ses caches avant de charger le nouveau JavaScript pour éviter
    // qu'un vieux app.js ne soit servi à la place du fichier déployé.
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((registration) => registration.unregister()));
    }
    if ('caches' in window) {
      const cacheNames = await caches.keys();
      await Promise.all(
        cacheNames
          .filter((name) => name.toLowerCase().startsWith('lifegame'))
          .map((name) => caches.delete(name))
      );
    }

    await import('./app.js?v=f9b516a');
  } catch (error) {
    console.error('LifeGame boot error:', error);
    const box = document.querySelector('#app');
    const details = error && error.message ? String(error.message) : 'Erreur inconnue';
    box.innerHTML = `
      <main class="boot-error">
        <div class="boot-card">
          <div class="boot-logo">L</div>
          <h1>LifeGame ne peut pas démarrer</h1>
          <p>Le chargement de la plateforme a rencontré une erreur.</p>
          <code>${details.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</code>
          <button onclick="location.reload()">Réessayer</button>
        </div>
      </main>`;
  }
})();
</script>
</body>
</html>
