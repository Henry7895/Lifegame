<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080A12">
<meta name="description" content="LifeGame — Play. Create. Connect.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="LifeGame">
<meta property="og:description" content="Une plateforme de jeux moderne et originale.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237C5CFF'/%3E%3Cpath d='M19 16v32h10V37h8c10 0 15-5 15-11S47 16 37 16H19zm10 8h8c4 0 6 1 6 4s-2 4-6 4h-8v-8z' fill='white'/%3E%3C/svg%3E">
<title>LifeGame</title>
</head>
<body>
<div id="app"><div class="boot-screen"><div class="boot-logo">L</div><strong>LifeGame</strong><span>Préparation de la plateforme…</span></div></div>

<script>
(async () => {
  const version = 'f9b516a';
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((registration) => registration.unregister()));
    }
    if ('caches' in window) {
      const cacheNames = await caches.keys();
      await Promise.all(
        cacheNames
          .filter((name) => name.toLowerCase().startsWith('lifegame'))
          .map((name) => caches.delete(name))
      );
    }

    for (const [rel, href] of [
      ['stylesheet', './styles.css?v=' + version],
      ['manifest', './manifest.webmanifest?v=' + version]
    ]) {
      const link = document.createElement('link');
      link.rel = rel;
      link.href = href;
      document.head.appendChild(link);
    }

    await import('./app.js?v=' + version);
  } catch (error) {
    console.error('LifeGame boot error:', error);
    const details = error && error.message ? String(error.message) : 'Erreur inconnue';
    const safe = details.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    document.querySelector('#app').innerHTML = '<main class="boot-error"><div class="boot-card"><div class="boot-logo">L</div><h1>LifeGame ne peut pas démarrer</h1><p>Le chargement de la plateforme a rencontré une erreur.</p><code>'+safe+'</code><button onclick="location.reload()">Réessayer</button></div></main>';
  }
})();
</script>
</body>
</html>
